services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stealth_badger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badger -d stealth_badger"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://badger:${POSTGRES_PASSWORD}@postgres:5432/stealth_badger
    volumes:
      - /mnt/dados2/signet/.cookie:/bitcoin/.cookie:ro
      # Só o `hostname` do hidden service, e só para leitura: a página de
      # acessos lê por onde o painel está acessível, e não controla nada.
      # A chave privada do endereço fica no volume, longe do backend.
      - tor-data:/var/lib/tor:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    profiles: ["ntfy"]
    ports:
      - "127.0.0.1:8090:80"

  # ── ACESSOS EXTERNOS ────────────────────────────────────────────────────
  # Três caminhos, três posturas, e nenhum sobe por padrão. Ligar é escolha de
  # quem hospeda: `docker compose --profile tor up -d`.
  #
  # Este arquivo não monta o socket do Docker, e por padrão o painel lê por
  # onde está acessível sem ligar nem desligar nada. Ligar e desligar pela tela
  # é um segundo arquivo, `docker-compose.controle.yml`, que precisa ser
  # somado a este de propósito — a razão está escrita lá dentro.

  # O mais soberano: ninguém no meio vê o tráfego nem o destino.
  tor:
    image: alpine:3.20
    profiles: ["tor"]
    command: >
      sh -c "apk add --no-cache tor >/dev/null &&
             cp /etc/torrc.template /etc/tor/torrc &&
             chown -R tor:tor /var/lib/tor &&
             chmod 700 /var/lib/tor/hidden_service 2>/dev/null || true;
             su tor -s /bin/sh -c 'tor -f /etc/tor/torrc'"
    volumes:
      - ./services/tor/torrc:/etc/torrc.template:ro
      - tor-data:/var/lib/tor
    depends_on:
      - nginx

  # Rede privada entre os seus aparelhos; a Tailscale vê metadado, não conteúdo.
  tailscale:
    build:
      context: .
      dockerfile: services/tailscale/Dockerfile
    profiles: ["tailscale"]
    hostname: stealth-badger
    environment:
      ACCESS_PROFILE: tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:stealth-badger
    volumes:
      - tailscale-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      - backend

  # A Cloudflare termina o TLS e enxerga o tráfego em claro. É escolha
  # legítima, e a tela diz isso sempre que o caminho está ligado.
  cloudflared:
    build:
      context: .
      dockerfile: services/cloudflared/Dockerfile
    profiles: ["cloudflared"]
    # `--metrics` abre a porta de prontidão na rede interna do compose, e é
    # dela que a página de acessos lê se o túnel tem conexão com a borda. Sem
    # ela o estado do caminho fica "não medido", que é honesto e menos útil.
    environment:
      ACCESS_PROFILE: cloudflared
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - backend
      - nginx

volumes:
  pgdata:
  tor-data:
  tailscale-state:
