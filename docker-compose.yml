services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stealth_badger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badger -d stealth_badger"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://badger:${POSTGRES_PASSWORD}@postgres:5432/stealth_badger
    volumes:
      - /mnt/dados2/signet/.cookie:/bitcoin/.cookie:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    profiles: ["ntfy"]
    ports:
      - "127.0.0.1:8090:80"

volumes:
  pgdata:
