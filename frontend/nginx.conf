server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida devolve o index, senão o painel
    # quebraria em um F5 fora da raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
